{% extends "base.html" %}


{% block title %}
Add Notes - SNS
{% endblock %}

{% block navmenu%}
    <a href="#">Files</a>
    <a href="{{url_for('mynotes')}}">Notes</a>
    <a href="{{url_for('profile')}}">Profile</a>
    <a href="{{url_for('logout')}}">Logout</a>
{%endblock%}

{% block content %}

<div class="form-container">

    <h1>
        Add Notes
    </h1>
    <p class ="form-subtitle">
        Add New Notes for your preference
    </p>
    <form
        method = "POST"
        action="{{url_for('add_notes')}}"
    >
    <div class="form-group">
        <label for="Title">
            Title
        </label>    
        <input
            type="text"
            name="Title"
            id="Title"
            placeholder="Enter Your Notes Title"
            required
        >
    </div>
    <div class="form-group">
        <label for="Content">
            Content
        </label>
        <textarea
            rows="5"
            colums="50"
            name="content"
            id="content"
            placeholder="Enter Your Notes Content"
            required
        ></textarea>
    </div>

    <button
        type="submit"
        class="btn btn-primary full-width"
    >
        Save Notes
    </button>
    </form>
</div>
{% endblock %}
